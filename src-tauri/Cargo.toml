[package]
name = "ticksidian-desktop"
version = "0.1.0"
description = "Tauri desktop shell for Ticksidian"
authors = ["Ticksidian"]
edition = "2021"

[lib]
name = "ticksidian_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
thiserror = "2"
# 이미지 쓰기 IPC의 x-ticksidian-path 헤더 디코딩(한글 경로는 헤더에 실을 수 없어
# JS가 encodeURIComponent로 보낸다). tauri 자체 의존성에도 있는 표준 crate.
percent-encoding = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
# M3-1f: refresh token을 OS-level secure storage(macOS Keychain / Windows
# Credential Manager / Linux Secret Service)에 보관하기 위한 cross-platform
# wrapper. tauri-plugin-stronghold는 매번 master password unlock이 필요해
# dev UX가 나쁨. keyring crate은 OS 기본 인증으로 자동 unlock.
keyring = { version = "3.6", default-features = false, features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
notify-debouncer-mini = "0.7.0"
# RAG 검색 (FTS5 + sqlite-vec) — Node scripts/rag-index-lib.mjs와 같은 버전 고정.
# sqlite-vec는 pre-v1이라 설계 계약대로 버전을 고정한다.
sqlite-vec = "0.1.9"
# 쿼리 임베딩을 Rust에서 Gemini API로 직접 호출 (프론트 CSP/API 키 노출 없음)
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["time", "rt-multi-thread", "sync"] }
# Vec<f32> → 바이트 직렬화 (sqlite-vec 공식 Rust 예제 방식)
zerocopy = { version = "0.8", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
